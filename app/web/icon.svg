<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#0b0f19" stroke="#0284c7" stroke-width="8" />
  <circle cx="256" cy="256" r="180" fill="url(#bgGrad)" opacity="0.85" filter="url(#glow)" />
  
  <!-- Brand Letters "EN" -->
  <text x="256" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="180" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">EN</text>
  
  <!-- Subtle Speaker Wave Accent -->
  <path d="M 370 200 A 70 70 0 0 1 370 312" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  <path d="M 395 175 A 110 110 0 0 1 395 337" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.5" />
</svg>
